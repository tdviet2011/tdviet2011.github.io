<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a55"/></marker></defs>
<rect width="1100" height="700" fill="#fff"/>
<text x="20" y="30" font-size="20" text-anchor="start" font-weight="700" fill="#1a2230">uart_tx — FSM tổng quát</text>
<text x="20" y="52" font-size="12.5" text-anchor="start" font-weight="400" fill="#5a6577">Điều kiện đặt trên mũi tên, việc làm khi chuyển trạng thái đặt dưới điều kiện. Chỉ xét ở cạnh lên clk.</text>
<circle cx="170" cy="270" r="78" fill="#eef3fb" stroke="#2b4c7e" stroke-width="2.5"/>
<text x="170" y="240" font-size="18" text-anchor="middle" font-weight="700" fill="#1a2230">IDLE</text>
<text x="170" y="260" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">rảnh</text>
<text x="170" y="284" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">tx = 1</text>
<text x="170" y="304" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">busy = 0</text>
<circle cx="550" cy="270" r="78" fill="#fff4e0" stroke="#a8661a" stroke-width="2.5"/>
<text x="550" y="240" font-size="18" text-anchor="middle" font-weight="700" fill="#1a2230">WAIT</text>
<text x="550" y="260" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">chờ tick16 đầu</text>
<text x="550" y="284" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">tx = 1</text>
<text x="550" y="304" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">busy = 1</text>
<circle cx="930" cy="270" r="78" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="2.5"/>
<text x="930" y="240" font-size="18" text-anchor="middle" font-weight="700" fill="#1a2230">SEND</text>
<text x="930" y="260" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">đang phát</text>
<text x="930" y="284" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">tx = shreg[0]</text>
<text x="930" y="304" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">busy = 1</text>
<path d="M30,270 H92" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="30" y="258" font-size="12" text-anchor="start" font-weight="400" fill="#5a6577">rst_n = 0</text>
<path d="M248,255 H472" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="360" y="196" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6cb0">accept</text>
<text x="360" y="214" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">start &amp; ~busy</text>
<text x="360" y="288" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">nạp shreg ← {1, data, 0}</text>
<text x="360" y="306" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">busy ← 1, bcnt ← 0</text>
<path d="M628,255 H852" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="740" y="196" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6cb0">first</text>
<text x="740" y="214" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">tick16 = 1</text>
<text x="740" y="288" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">run ← 1, tcnt ← 0</text>
<text x="740" y="306" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">tx xuống 0 (start bit)</text>
<path d="M930,348 C930,500 170,500 170,348" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="550" y="492" font-size="13" text-anchor="middle" font-weight="700" fill="#2b6cb0">last</text>
<text x="550" y="510" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bit_done &amp; bcnt == 9</text>
<text x="550" y="528" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">hết stop bit: busy ← 0, run ← 0</text>
<path d="M120,200 C95,110 245,110 220,200" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="170" y="100" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">chưa có start</text>
<path d="M500,200 C475,110 625,110 600,200" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="550" y="100" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">chưa có tick16: đợi</text>
<path d="M880,200 C855,110 1005,110 980,200" fill="none" stroke="#2b3a55" stroke-width="2" marker-end="url(#m)"/>
<text x="930" y="64" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">go &amp; ~bit_done:</text>
<text x="930" y="80" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">tcnt ← tcnt + 1</text>
<text x="930" y="98" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bit_done &amp; bcnt ≠ 9:</text>
<text x="930" y="114" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230">dịch shreg, bcnt ← bcnt + 1</text>
<text x="20" y="566" font-size="13" text-anchor="start" font-weight="700" fill="#1a2230">Trong trạng thái SEND, bcnt cho biết đang phát bit nào (mỗi ô dài 16 tick16, cả khung 160 tick16):</text>
<rect x="20" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="70" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">start</text>
<text x="70" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 0</text>
<rect x="124" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="174" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D0</text>
<text x="174" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 1</text>
<rect x="228" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="278" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D1</text>
<text x="278" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 2</text>
<rect x="332" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="382" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D2</text>
<text x="382" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 3</text>
<rect x="436" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="486" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D3</text>
<text x="486" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 4</text>
<rect x="540" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="590" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D4</text>
<text x="590" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 5</text>
<rect x="644" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="694" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D5</text>
<text x="694" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 6</text>
<rect x="748" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="798" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D6</text>
<text x="798" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 7</text>
<rect x="852" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="902" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">D7</text>
<text x="902" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 8</text>
<rect x="956" y="580" width="100" height="56" rx="6" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="1.6"/>
<text x="1006" y="602" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">stop</text>
<text x="1006" y="622" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">bcnt = 9</text>
<text x="20" y="664" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">Mã hóa trạng thái bằng 2 cờ: busy = (trạng thái ≠ IDLE), run = (trạng thái = SEND). IDLE = 00, WAIT = 10, SEND = 11.</text>
<text x="20" y="684" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">Chỉ 3 trạng thái vì start/data/stop do bộ đếm bit phân biệt, không cần tách thành trạng thái riêng.</text>
</svg>