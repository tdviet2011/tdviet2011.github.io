<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 840" width="1300" height="840" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a55"/></marker></defs>
<rect width="1300" height="840" fill="#fff"/>
<text x="20" y="30" font-size="20" text-anchor="start" font-weight="700" fill="#1a2230">uart_top — luồng dữ liệu và điều khiển</text>
<text x="20" y="52" font-size="12.5" text-anchor="start" font-weight="400" fill="#5a6577">Hàng trên: đường phát (người dùng → chân tx). Hàng dưới: đường thu (chân rx → người dùng). Mọi khối dùng chung clk, rst_n. Tham số: CLK_FREQ, BAUD, DEPTH.</text>
<rect x="20" y="115" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="132" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">wr_en</text>
<rect x="20" y="148" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="165" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">wr_data[7:0]</text>
<rect x="20" y="205" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="222" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">tx_full</text>
<path d="M130,127 H200" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<path d="M130,160 H200" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<path d="M200,217 H130" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<rect x="200" y="100" width="220" height="140" rx="10" fill="#eef3fb" stroke="#2b4c7e" stroke-width="2"/>
<text x="310" y="124" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">tx_fifo (sync_fifo)</text>
<text x="215" y="150" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">rộng 8 bit, sâu DEPTH</text>
<text x="215" y="170" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">ghi: wr_en, wr_data</text>
<text x="215" y="190" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">đọc: rd_en, rd_data (FWFT)</text>
<text x="215" y="210" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">cờ: full, empty</text>
<path d="M420,140 H700" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="560" y="133" font-size="11.5" text-anchor="middle" font-weight="400" fill="#34405a">rd_data[7:0] → data</text>
<rect x="470" y="175" width="180" height="95" rx="8" fill="#fff4e0" stroke="#a8661a" stroke-width="2"/>
<text x="560" y="196" font-size="13.5" text-anchor="middle" font-weight="700" fill="#8a4f10">Lấy byte để phát</text>
<text x="560" y="217" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">start = pop</text>
<text x="560" y="235" font-size="12" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">= ~tx_empty &amp; ~busy</text>
<text x="560" y="257" font-size="11" text-anchor="middle" font-weight="400" fill="#5a6577">cao đúng 1 chu kỳ</text>
<path d="M420,200 H470" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="445" y="194" font-size="10.5" text-anchor="middle" font-weight="400" fill="#34405a">empty</text>
<path d="M650,205 H700" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="675" y="199" font-size="11" text-anchor="middle" font-weight="400" fill="#34405a">start</text>
<path d="M700,240 H650" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="675" y="234" font-size="11" text-anchor="middle" font-weight="400" fill="#34405a">busy</text>
<path d="M560,270 V292 H330 V240" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="445" y="286" font-size="11" text-anchor="middle" font-weight="400" fill="#34405a">pop (= rd_en)</text>
<rect x="700" y="100" width="240" height="160" rx="10" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="2"/>
<text x="820" y="124" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">uart_tx</text>
<text x="715" y="150" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">start &amp; ~busy: chốt data</text>
<text x="715" y="170" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">phát 10 bit: start, D0..D7, stop</text>
<text x="715" y="190" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">mỗi bit 16 tick16</text>
<text x="715" y="210" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">busy hạ sau stop bit</text>
<path d="M940,180 H1010" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<rect x="1010" y="168" width="60" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1040.0" y="185" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">tx</text>
<rect x="540" y="330" width="280" height="65" rx="10" fill="#f2edfa" stroke="#6a4c9c" stroke-width="2"/>
<text x="680" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">baud_gen</text>
<text x="680" y="376" font-size="12" text-anchor="middle" font-weight="400" fill="#34405a">tick16: 1 xung mỗi 54 clk</text>
<path d="M820,362 H870 V260" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<circle cx="870" cy="362" r="3.5" fill="#2b3a55"/>
<path d="M870,362 V440" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="878" y="310" font-size="11" text-anchor="start" font-weight="400" fill="#34405a">tick16</text>
<rect x="1010" y="470" width="60" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1040.0" y="487" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">rx</text>
<path d="M1010,482 H940" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<rect x="700" y="440" width="240" height="160" rx="10" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="2"/>
<text x="820" y="464" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">uart_rx</text>
<text x="715" y="492" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">2 FF đồng bộ rx</text>
<text x="715" y="512" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">lấy mẫu giữa mỗi bit</text>
<text x="715" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">ra: data[7:0], valid, frame_err</text>
<path d="M700,465 H420" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="560" y="459" font-size="11.5" text-anchor="middle" font-weight="400" fill="#34405a">data[7:0] → wr_data</text>
<rect x="470" y="490" width="180" height="100" rx="8" fill="#fff4e0" stroke="#a8661a" stroke-width="2"/>
<text x="560" y="511" font-size="13.5" text-anchor="middle" font-weight="700" fill="#8a4f10">Ghi byte vào rx_fifo</text>
<text x="560" y="532" font-size="11.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">wr_en = valid &amp; ~rx_full</text>
<text x="560" y="551" font-size="11.5" text-anchor="middle" font-weight="400" fill="#34405a">valid &amp; rx_full: bỏ byte,</text>
<text x="560" y="568" font-size="11.5" text-anchor="middle" font-weight="400" fill="#34405a">rx_overflow ← 1 (giữ tới reset)</text>
<path d="M700,510 H650" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="675" y="504" font-size="11" text-anchor="middle" font-weight="400" fill="#34405a">valid</text>
<path d="M470,530 H420" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="445" y="524" font-size="10.5" text-anchor="middle" font-weight="400" fill="#34405a">wr_en</text>
<path d="M420,570 H470" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<text x="445" y="564" font-size="10.5" text-anchor="middle" font-weight="400" fill="#34405a">full</text>
<rect x="200" y="440" width="220" height="160" rx="10" fill="#eef3fb" stroke="#2b4c7e" stroke-width="2"/>
<text x="310" y="464" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">rx_fifo (sync_fifo)</text>
<text x="215" y="492" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">rộng 8 bit, sâu DEPTH</text>
<text x="215" y="512" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">ghi: wr_en, wr_data</text>
<text x="215" y="532" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">đọc: rd_en, rd_data (FWFT)</text>
<text x="215" y="552" font-size="12" text-anchor="start" font-weight="400" fill="#34405a">cờ: full, empty</text>
<rect x="20" y="470" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="487" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">rd_en</text>
<rect x="20" y="515" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="532" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">rd_data[7:0]</text>
<rect x="20" y="560" width="110" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="75.0" y="577" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">rx_empty</text>
<path d="M130,482 H200" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<path d="M200,527 H130" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<path d="M200,572 H130" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<path d="M560,590 V640" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<rect x="500" y="640" width="120" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="560.0" y="657" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">rx_overflow</text>
<path d="M820,600 V640" fill="none" stroke="#2b3a55" stroke-width="1.9" marker-end="url(#m)"/>
<rect x="775" y="640" width="90" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="820.0" y="657" font-size="13.5" text-anchor="middle" font-weight="400" fill="#1a2230">frame_err</text>
<path d="M1070,180 H1120 V482 H1070" fill="none" stroke="#2b3a55" stroke-width="1.9" stroke-dasharray="6 4" marker-end="url(#m)"/>
<text x="1130" y="330" font-size="11.5" text-anchor="start" font-weight="400" fill="#5a6577">nối vòng</text>
<text x="1130" y="347" font-size="11.5" text-anchor="start" font-weight="400" fill="#5a6577">khi test</text>
<text transform="rotate(90 1136 330)" x="1136" y="330" font-size="1" fill="none"></text>
<circle cx="200" cy="100" r="12" fill="#2b3a55"/>
<text x="200" y="105" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">1</text>
<circle cx="470" cy="175" r="12" fill="#2b3a55"/>
<text x="470" y="180" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">2</text>
<circle cx="700" cy="100" r="12" fill="#2b3a55"/>
<text x="700" y="105" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">3</text>
<circle cx="700" cy="440" r="12" fill="#2b3a55"/>
<text x="700" y="445" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">4</text>
<circle cx="470" cy="490" r="12" fill="#2b3a55"/>
<text x="470" y="495" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">5</text>
<circle cx="200" cy="440" r="12" fill="#2b3a55"/>
<text x="200" y="445" font-size="13" text-anchor="middle" font-weight="700" fill="#fff">6</text>
<text x="20" y="712" font-size="13" text-anchor="start" font-weight="400" fill="#1a2230">① Người dùng ghi byte vào tx_fifo (wr_en, wr_data). tx_full = 1 thì không ghi được.</text>
<text x="20" y="734" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">② tx_fifo không rỗng và uart_tx rảnh: pop và start là cùng một dây, cao 1 chu kỳ vì busy lên ngay sau start.</text>
<text x="20" y="756" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">③ uart_tx phát 10 bit ra chân tx.   ④ uart_rx thu từ chân rx, báo valid (khung đúng) hoặc frame_err (stop bit sai).</text>
<text x="20" y="778" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">⑤ valid và rx_fifo chưa đầy: ghi byte vào rx_fifo. rx_fifo đầy: bỏ byte và rx_overflow lên 1 (giữ tới khi reset).</text>
<text x="20" y="800" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">⑥ Người dùng đọc: rx_empty = 0 thì rd_data đã hợp lệ, rd_en lấy byte ra. frame_err là xung 1 chu kỳ lấy thẳng từ uart_rx.</text>
</svg>