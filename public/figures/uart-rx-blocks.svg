<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 880" width="1450" height="880" font-family="Segoe UI, Arial, sans-serif">
<defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b3a55"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b6cb0"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0661a"/></marker></defs>
<rect width="1450" height="880" fill="#fff"/>
<text x="20" y="28" font-size="20" text-anchor="start" font-weight="700" fill="#1a2230">uart_rx — sơ đồ khối chi tiết</text>
<text x="330" y="28" font-size="12.5" text-anchor="start" font-weight="400" fill="#5a6577">Mọi thanh ghi dùng clk và rst_n (bất đồng bộ). Xanh: điều khiển đi xuống. Cam: trạng thái đi lên. IDLE, START, DATA, STOP là giá trị của state.</text>
<rect x="675" y="40" width="80" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="715.0" y="57" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">tick16</text>
<path d="M715,64 V74 H440 V84" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M715,64 V84" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M715,74 H1265 V84" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<rect x="20" y="84" width="1410" height="166" rx="10" fill="#fff8ec" stroke="#a8661a" stroke-width="2"/>
<text x="36" y="104" font-size="13" text-anchor="start" font-weight="700" fill="#8a4f10">Logic sự kiện (tổ hợp, không có nhớ)</text>
<rect x="40" y="120" width="250" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="165" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">start_det</text>
<text x="165" y="170" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">IDLE &amp; ~rx_s2</text>
<text x="165" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">thấy cạnh xuống: bắt đầu start bit</text>
<rect x="315" y="120" width="250" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="440" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">mid_start</text>
<text x="440" y="170" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">START &amp; tick16 &amp; tcnt==7</text>
<text x="440" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">tới giữa start bit: kiểm lại</text>
<rect x="590" y="120" width="250" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="715" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">samp</text>
<text x="715" y="170" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">DATA &amp; tick16 &amp; tcnt==15</text>
<text x="715" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">giữa bit dữ liệu: lấy mẫu rx_s2</text>
<rect x="865" y="120" width="250" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="990" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">last_bit</text>
<text x="990" y="170" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">samp &amp; bcnt==7</text>
<text x="990" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">đã lấy đủ 8 bit dữ liệu</text>
<rect x="1140" y="120" width="250" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="1265" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">stop_samp</text>
<text x="1265" y="170" font-size="12.5" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">STOP &amp; tick16 &amp; tcnt==15</text>
<text x="1265" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">giữa stop bit: kết thúc khung</text>
<path d="M840,172 H865" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<rect x="20" y="330" width="250" height="390" rx="10" fill="#f4f7fc" stroke="#2b4c7e" stroke-width="2"/>
<text x="145.0" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">Đồng bộ rx (2 flip-flop)</text>
<rect x="50" y="400" width="80" height="50" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="90" y="430" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">rx_s1</text>
<rect x="165" y="400" width="80" height="50" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="205" y="430" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">rx_s2</text>
<path d="M130,425 H165" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M35,745 V425 H50" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M200,400 V250" fill="none" stroke="#c0661a" stroke-width="1.8" marker-end="url(#mo)"/>
<text x="204" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#a8561a">rx_s2</text>
<text x="58" y="560" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">luôn dịch mỗi clk</text>
<text x="58" y="580" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">2 FF nối tiếp tránh metastable</text>
<text x="58" y="600" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">(rx đến từ ngoài,</text>
<text x="58" y="620" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">không đồng bộ với clk)</text>
<rect x="290" y="330" width="280" height="390" rx="10" fill="#f4f7fc" stroke="#2b4c7e" stroke-width="2"/>
<text x="430.0" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">Trạng thái state (2 bit)</text>
<rect x="310" y="385" width="120" height="55" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="370" y="410" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">state</text>
<text x="370" y="430" font-size="9.5" text-anchor="middle" font-weight="400" fill="#1a2230">IDLE/START/DATA/STOP</text>
<path d="M430,412 H555 V250" fill="none" stroke="#c0661a" stroke-width="1.8" marker-end="url(#mo)"/>
<text x="551" y="270" font-size="12" text-anchor="end" font-weight="600" fill="#a8561a">state</text>
<path d="M302,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="306" y="282" font-size="11" text-anchor="start" font-weight="600" fill="#2b6cb0">start_det</text>
<path d="M364,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="368" y="304" font-size="11" text-anchor="start" font-weight="600" fill="#2b6cb0">mid_start</text>
<path d="M426,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="430" y="282" font-size="11" text-anchor="start" font-weight="600" fill="#2b6cb0">last_bit</text>
<path d="M488,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="492" y="304" font-size="11" text-anchor="start" font-weight="600" fill="#2b6cb0">stop_samp</text>
<text x="305" y="500" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">IDLE  → START : start_det</text>
<text x="305" y="520" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">START → DATA  : mid_start &amp; rx_s2==0</text>
<text x="305" y="540" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">START → IDLE  : mid_start &amp; rx_s2==1</text>
<text x="305" y="560" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">               (nhiễu, bỏ qua)</text>
<text x="305" y="580" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">DATA  → STOP  : last_bit</text>
<text x="305" y="600" font-size="11.5" text-anchor="start" font-weight="400" fill="#34405a" font-family="Consolas, Menlo, monospace">STOP  → IDLE  : stop_samp</text>
<rect x="590" y="330" width="300" height="390" rx="10" fill="#f4f7fc" stroke="#2b4c7e" stroke-width="2"/>
<text x="740.0" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">Đếm tick tcnt [3:0]</text>
<rect x="605" y="385" width="70" height="50" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="640" y="415" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">tcnt</text>
<rect x="700" y="385" width="50" height="50" rx="25" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="725" y="416" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">+1</text>
<rect x="780" y="380" width="45" height="66" rx="8" fill="#e9f6ee" stroke="#2f7a4d" stroke-width="2"/>
<text x="802" y="413" font-size="12" text-anchor="middle" font-weight="700" fill="#1a2230">mux</text>
<text x="784" y="398" font-size="10.5" text-anchor="start" font-weight="400" fill="#1a2230">+1</text>
<text x="784" y="436" font-size="10.5" text-anchor="start" font-weight="400" fill="#1a2230">0</text>
<path d="M675,410 H700" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M750,410 H765 V398 H780" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M765,428 H780" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<text x="755" y="432" font-size="11" text-anchor="end" font-weight="400" fill="#1a2230">0</text>
<path d="M825,412 H845 V368 H640 V385" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<circle cx="687" cy="410" r="3.5" fill="#2b3a55"/>
<path d="M687,410 V510" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<rect x="620" y="510" width="150" height="40" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="695" y="536" font-size="12.5" text-anchor="middle" font-weight="700" fill="#1a2230" font-family="Consolas, Menlo, monospace">== 7  hoặc  == 15</text>
<path d="M770,530 H875 V250" fill="none" stroke="#c0661a" stroke-width="1.8" marker-end="url(#mo)"/>
<text x="871" y="292" font-size="12" text-anchor="end" font-weight="600" fill="#a8561a">tcnt==7/15</text>
<path d="M615,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="620" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">tick16</text>
<path d="M685,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="690" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">clr</text>
<text x="605" y="600" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">tăng 1 khi tick16 và state ≠ IDLE</text>
<text x="605" y="620" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">clr = start_det | mid_start | samp | stop_samp</text>
<text x="605" y="640" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">mux chọn 0 khi clr</text>
<text x="605" y="660" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">START đếm 8 tick (tcnt 0..7);</text>
<text x="605" y="680" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">DATA, STOP đếm 16 tick (tcnt 0..15)</text>
<rect x="910" y="330" width="200" height="390" rx="10" fill="#f4f7fc" stroke="#2b4c7e" stroke-width="2"/>
<text x="1010.0" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">Đếm bit bcnt [2:0]</text>
<rect x="922" y="385" width="70" height="50" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="957" y="415" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">bcnt</text>
<rect x="1020" y="385" width="50" height="50" rx="25" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="1045" y="416" font-size="14" text-anchor="middle" font-weight="700" fill="#1a2230">+1</text>
<path d="M992,410 H1020" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M1070,410 H1082 V368 H957 V385" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<circle cx="1005" cy="410" r="3.5" fill="#2b3a55"/>
<path d="M1005,410 V510" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<rect x="965" y="510" width="80" height="40" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="1005" y="536" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2230" font-family="Consolas, Menlo, monospace">== 7</text>
<path d="M1045,530 H1095 V250" fill="none" stroke="#c0661a" stroke-width="1.8" marker-end="url(#mo)"/>
<text x="1087" y="272" font-size="12" text-anchor="end" font-weight="600" fill="#a8561a">bcnt==7</text>
<path d="M935,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="940" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">samp</text>
<path d="M1005,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="1010" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">start_det</text>
<text x="925" y="600" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">+1 khi samp</text>
<text x="925" y="620" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">về 0 khi start_det</text>
<text x="925" y="640" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">đếm 0..7 (8 bit)</text>
<rect x="1130" y="330" width="300" height="390" rx="10" fill="#f4f7fc" stroke="#2b4c7e" stroke-width="2"/>
<text x="1280.0" y="354" font-size="14.5" text-anchor="middle" font-weight="700" fill="#1a2230">Thanh ghi dịch data [7:0] và cờ</text>
<rect x="1142" y="393" width="60" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1172.0" y="410" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">rx_s2</text>
<path d="M1202,405 H1215" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<rect x="1215" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1227" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">7</text>
<rect x="1241" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1253" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">6</text>
<rect x="1267" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1279" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">5</text>
<rect x="1293" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1305" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">4</text>
<rect x="1319" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1331" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">3</text>
<rect x="1345" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1357" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">2</text>
<rect x="1371" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1383" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">1</text>
<rect x="1397" y="390" width="24" height="34" rx="4" fill="#fff" stroke="#2b4c7e" stroke-width="1.6"/>
<text x="1409" y="412" font-size="12" text-anchor="middle" font-weight="600" fill="#1a2230">0</text>
<text x="1215" y="382" font-size="11" text-anchor="start" font-weight="400" fill="#5a6577">dịch phải khi samp, bit mới vào MSB</text>
<rect x="1260" y="630" width="80" height="60" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="1300" y="655" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2230">valid</text>
<text x="1300" y="675" font-size="11" text-anchor="middle" font-weight="400" fill="#5a6577">1 FF</text>
<rect x="1348" y="630" width="80" height="60" rx="8" fill="#fff" stroke="#2b4c7e" stroke-width="2"/>
<text x="1388" y="655" font-size="13" text-anchor="middle" font-weight="700" fill="#1a2230">frame_err</text>
<text x="1388" y="675" font-size="11" text-anchor="middle" font-weight="400" fill="#5a6577">1 FF</text>
<rect x="1280" y="448" width="80" height="22" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1320.0" y="463" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">data[7:0]</text>
<path d="M1320,424 V448" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M1300,690 V745" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M1388,690 V745" fill="none" stroke="#2b3a55" stroke-width="1.8" marker-end="url(#mk)"/>
<path d="M1155,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="1160" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">samp</text>
<path d="M1230,250 V330" fill="none" stroke="#2b6cb0" stroke-width="1.8" marker-end="url(#mb)"/>
<text x="1235" y="292" font-size="12" text-anchor="start" font-weight="600" fill="#2b6cb0">stop_samp</text>
<text x="1145" y="500" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">data là chính thanh ghi dịch,</text>
<text x="1145" y="520" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">chỉ hợp lệ khi valid = 1.</text>
<text x="1145" y="540" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">stop_samp: valid ← rx_s2,</text>
<text x="1145" y="560" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">frame_err ← ~rx_s2;</text>
<text x="1145" y="580" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">các lúc khác cả hai về 0.</text>
<text x="1145" y="600" font-size="12.5" text-anchor="start" font-weight="400" fill="#34405a">(mỗi cờ chỉ cao 1 chu kỳ)</text>
<rect x="1272" y="745" width="56" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1300.0" y="762" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">valid</text>
<rect x="1344" y="745" width="88" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="1388.0" y="762" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">frame_err</text>
<rect x="10" y="745" width="50" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="35.0" y="762" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">rx</text>
<text x="20" y="790" font-size="13" text-anchor="start" font-weight="700" fill="#1a2230">Tổng: 21 flip-flop = rx_s1, rx_s2 (2) + state (2) + tcnt (4) + bcnt (3) + data (8) + valid, frame_err (2).</text>
<text x="20" y="812" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">Một khung: rx xuống 0 → đợi 8 tick16 tới giữa start bit, kiểm lại còn 0 → cứ 16 tick16 lấy mẫu 1 bit (8 lần, LSB trước) → 16 tick16 nữa lấy mẫu stop bit.</text>
<text x="20" y="832" font-size="13" text-anchor="start" font-weight="400" fill="#34405a">Stop bit = 1: valid lên 1 chu kỳ. Stop bit = 0: frame_err lên 1 chu kỳ. Xong cả hai thì về IDLE.</text>
</svg>