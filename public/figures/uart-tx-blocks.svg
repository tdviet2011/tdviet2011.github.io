<text x="400" y="170" font-size="13" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">busy &amp; ~run &amp; tick16</text>
<text x="400" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">tick đầu: bắt đầu start bit</text>
<rect x="540" y="120" width="220" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
