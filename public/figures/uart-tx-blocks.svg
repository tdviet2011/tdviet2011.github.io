<text x="900" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">hết 1 bit (đủ 16 tick)</text>
<rect x="1040" y="120" width="220" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
