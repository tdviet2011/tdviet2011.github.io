<text x="650" y="170" font-size="13" text-anchor="middle" font-weight="400" fill="#1a2230" font-family="Consolas, Menlo, monospace">run &amp; tick16</text>
<text x="650" y="196" font-size="12" text-anchor="middle" font-weight="400" fill="#5a6577">đang phát và có tick</text>
<rect x="790" y="120" width="220" height="105" rx="8" fill="#fff" stroke="#a8661a" stroke-width="1.6"/>
<text x="900" y="144" font-size="15" text-anchor="middle" font-weight="700" fill="#1a2230">bit_done</text>
