<rect width="1300" height="870" fill="#fff"/>
<text x="20" y="28" font-size="20" text-anchor="start" font-weight="700" fill="#1a2230">uart_tx — sơ đồ khối chi tiết</text>
<text x="330" y="28" font-size="12.5" text-anchor="start" font-weight="400" fill="#5a6577">Mọi thanh ghi dùng clk và rst_n (bất đồng bộ). Mũi tên xanh: tín hiệu điều khiển đi xuống. Mũi tên cam: trạng thái đi lên.</text>
<rect x="110" y="40" width="80" height="24" rx="6" fill="#fff" stroke="#2b3a55" stroke-width="1.6"/>
<text x="150.0" y="57" font-size="14" text-anchor="middle" font-weight="400" fill="#1a2230">start</text>
